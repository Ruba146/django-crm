<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | Northstar CRM</title>
    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="auth-body">
<div class="auth-shell">
    <div class="auth-card card">
        <div class="card-body p-4">
            <h1 class="h5 mb-2">Forgot Password</h1>
            <p class="text-muted">Enter your account email to receive a reset link.</p>
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    {{ form.email }}
                </div>
                <button class="btn btn-primary w-100" type="submit">Send Reset Link</button>
            </form>
            <div class="text-center mt-3"><a href="{% url 'login' %}" class="small text-decoration-none">Back to login</a></div>
        </div>
    </div>
</div>
</body>
</html>
