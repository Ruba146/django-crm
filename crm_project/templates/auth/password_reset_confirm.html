<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set New Password | Northstar CRM</title>
    {% load static %}
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="auth-body">
<div class="auth-shell">
    <div class="auth-card card">
        <div class="card-body p-4">
            <h1 class="h5 mb-2">Set a new password</h1>
            <form method="post">
                {% csrf_token %}
                <div class="mb-2"><label class="form-label">New password</label>{{ form.new_password1 }}</div>
                <div class="mb-3"><label class="form-label">Confirm new password</label>{{ form.new_password2 }}</div>
                <button class="btn btn-primary w-100" type="submit">Update Password</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
